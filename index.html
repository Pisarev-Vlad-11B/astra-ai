/* ASTRA reference layout */
body{background:#070612;color:#f6f2ff}
.ambient-art{opacity:1}
.ambient-art:before{width:720px;height:720px;left:-300px;top:-420px;background:#6135d9;opacity:.13;filter:blur(115px)}
.ambient-art:after{width:650px;height:650px;right:-310px;bottom:-380px;background:#263bd8;opacity:.16}
.ambient-line{stroke-width:1.05;opacity:.22;filter:drop-shadow(0 0 8px #8055ff88)}
.ambient-line.alt{stroke-width:.8;opacity:.12}
.ambient-orbit{opacity:.08}
.sidebar{width:226px;padding:40px 16px 20px;background:rgba(12,9,28,.72);backdrop-filter:blur(24px);border-right:1px solid #8c6bff22}
.brand{justify-content:center;flex-direction:column;gap:10px;padding:0 0 58px}
.brandicon{width:76px;height:76px;border:0;background:transparent;box-shadow:none;border-radius:0}
.brandicon svg{width:76px;height:76px;filter:drop-shadow(0 0 12px #8e5cff88)}
.brand b{font-size:22px;letter-spacing:5px;font-weight:600}
.brand small{display:none}
.new,.navlabel,.bottom{display:none}
.nav{gap:12px}
.nav button{width:100%;padding:17px 16px;border-radius:14px;font-size:16px;color:#b9b2d2}
.nav button .ni{width:30px;font-size:19px}
.nav button.active{background:linear-gradient(110deg,#7625e9aa,#332064bb);border:1px solid #9b62ff88;box-shadow:0 0 28px #702eea33,inset 0 1px #ffffff18}
.nav button .code-mark{display:inline-block;width:30px;color:#b49aff;font-size:15px;font-weight:800;letter-spacing:-2px}
.sidebar-bottom{margin-top:auto;padding:18px 0 4px;display:flex;justify-content:center}
.new-chat{width:48px;height:48px;border-radius:50%;border:1px solid #a77bff88;background:linear-gradient(145deg,#8b54ed55,#34205f99);color:#eee5ff;font-size:27px;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 0 24px #7842e944,inset 0 1px #ffffff25;transition:transform .2s,box-shadow .2s,background .2s}
.new-chat:hover{transform:translateY(-2px) scale(1.06);background:linear-gradient(145deg,#a56aff77,#48277cbb);box-shadow:0 0 30px #965cff77,inset 0 1px #ffffff35}
.nav button .ni{width:30px;font-size:19px}
.nav button.active{background:linear-gradient(110deg,#7625e9aa,#332064bb);border:1px solid #9b62ff88;box-shadow:0 0 28px #702eea33,inset 0 1px #ffffff18}
.main{min-height:100vh}
.top{height:12px;flex-shrink:0}
.content{width:100%;max-width:none;min-height:calc(100vh - 12px);padding:0 3.2vw 40px;justify-content:center;position:relative}
.hero{margin:auto auto 0;display:flex;flex-direction:column;align-items:center;transform:translateY(-8px)}
.logoStage{width:470px;height:285px;margin:0 auto 8px}
.logoStage svg{overflow:visible}
.ribbon,.r2,.r3{display:none}
.liquid{stroke-width:17;filter:url(#glow)}
.shine{stroke-width:2.2}
h1{font-size:clamp(36px,4vw,58px);font-weight:500;letter-spacing:15px;margin:0 0 12px;padding-left:15px}
.hero p{font-size:clamp(15px,1.6vw,22px);color:#a99bdf}
.model{display:none}
.cards{display:none}
.composer{width:100%;max-width:1320px;margin:0 auto 0;padding:13px 16px 13px 25px;border:1px solid #8654ec88;border-radius:40px;background:linear-gradient(100deg,#1a1234cc,#17102dcc);box-shadow:0 0 28px #5423c633,inset 0 1px #ffffff12;backdrop-filter:blur(22px);display:flex;align-items:center;gap:16px}
.composer textarea{height:38px;min-height:38px;flex:1;font-size:16px;padding:8px 0}
.foot{display:flex;align-items:center;gap:15px}
.tools{gap:6px}
.tools button{background:transparent;border:0;font-size:0;padding:5px}
.tools button:first-child{font-size:0}
.tools button:first-child:before{content:"↗";font-size:23px;color:#d8d0ff}
.tools button:nth-child(n+2){display:none}
.send{width:54px;height:54px;border-radius:50%;font-size:0;box-shadow:0 0 22px #773fff77}
.send:before{content:"➤";font-size:22px}
.note{display:none}

/* vivid flowing violet-blue background ribbons */
.ambient-art{opacity:1!important}
.ambient-art:before{width:720px;height:720px;left:-280px;top:48%;background:#6424ed;opacity:.2;filter:blur(125px)}

/* slightly more compact proportions */
.logoStage{width:400px;height:245px}
h1{font-size:clamp(32px,3.5vw,50px);letter-spacing:12px}

/* Lightweight background motion: keep SVG paths free of per-frame CSS transforms. */
.ambient-art svg>path{animation:none!important;will-change:auto}



/* reposition new-chat control in the lower-right of the workspace */
.sidebar-bottom{position:fixed;right:28px;bottom:24px;z-index:10;margin:0;padding:0;display:flex;justify-content:center}
/* make active navigation tiles just a little more compact */
.nav{gap:10px}
.nav button{padding:15px 14px}

.new-chat svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}

/* new chat control inside the tabs panel, bottom-right */
.sidebar{position:relative}
.sidebar-bottom{margin-top:auto;padding:18px 0 4px;display:flex;justify-content:flex-end;align-items:center}
.new-chat{position:static;width:auto;height:auto;display:inline-flex;align-items:center;gap:10px;padding:0;border:0;background:transparent;color:#e8e0ff;font:600 14px "Manrope",sans-serif;box-shadow:none;cursor:pointer;transform:translateZ(0);transition:transform .38s cubic-bezier(.2,.75,.25,1),color .38s ease}
.new-chat:hover{transform:scale(1.025);background:transparent;box-shadow:none;color:#fff}
.new-chat:active{transform:scale(.99)}
.new-chat:focus-visible{outline:2px solid #b99aff;outline-offset:5px;border-radius:15px}
.new-chat-icon{width:42px;height:42px;border:1px solid #a77bff77;border-radius:13px;background:linear-gradient(145deg,#8b54ed44,#34205f88);display:grid;place-items:center;box-shadow:0 0 20px #7842e933,inset 0 1px #ffffff25;transition:background .38s ease,border-color .38s ease,box-shadow .4s ease}
.new-chat:hover .new-chat-icon{border-color:#c1a1ff;background:linear-gradient(145deg,#a36aff66,#422576aa);box-shadow:0 0 25px #8950f055,inset 0 1px #ffffff35}
.new-chat svg{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s ease}
.new-chat-label{letter-spacing:.2px;transition:text-shadow .38s ease}
.new-chat:hover .new-chat-label{text-shadow:0 0 12px #b58aff66}
@media(prefers-reduced-motion:reduce){.new-chat,.new-chat-icon,.new-chat svg,.new-chat-label{transition:none!important}}
@media(max-width:580px){.sidebar-bottom{padding:18px 0 4px}.new-chat-icon{width:39px;height:39px}.new-chat{gap:8px;font-size:13px}}


/* Hover-анимации — точная механика из ЕГЭ-тренажёра */
.history button,
.tools button,
.new-chat,
.new-chat-icon,
.send{
  will-change:transform;
  transition:transform 1.05s cubic-bezier(.16,1,.3,1),
             border-color 1.05s ease,
             box-shadow 1.05s ease,
             background 1.05s ease,
             color 1.05s ease,
             filter 1.05s ease;
}
.history button:hover,
.tools button:hover,
.new-chat:hover,
.new-chat:hover .new-chat-icon,
.send:hover{
  transform:translateY(-4px) scale(1.018);
  border-color:#b89aff88;
  box-shadow:0 15px 30px rgba(104,65,180,.16),0 0 0 3px rgba(169,138,255,.07);
}
.history button:active,
.tools button:active,
.new-chat:active,
.send:active{
  transform:translateY(-1px) scale(.99);
  transition-duration:.18s;
}
@media(hover:none){
  .nav button:hover,.history button:hover,.tools button:hover,
  .new-chat:hover,.new-chat:hover .new-chat-icon,.send:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
  .history button,.tools button,.new-chat,.new-chat-icon,.send{
    transition:none!important;
    will-change:auto;
  }
}


/* ASTRA — мгновенная реакция вкладок */
.nav button{
  position:relative;
  border:1px solid transparent;
  transition:transform .12s ease-out,
             background-color .12s ease-out,
             color .12s ease-out,
             border-color .12s ease-out,
             box-shadow .12s ease-out !important;
  transition-delay:0s !important;
  will-change:transform;
}
.nav button:not(.active):hover{
  transform:translateY(-2px);
  background:linear-gradient(110deg,rgba(118,37,233,.42),rgba(51,32,100,.55));
  color:#fff;
  border-color:rgba(155,98,255,.7);
  box-shadow:0 8px 22px rgba(112,46,234,.28),inset 0 1px rgba(255,255,255,.12);
}
.nav button.active,
.nav button.active:hover{
  background:linear-gradient(110deg,#7625e9bb,#332064cc);
  color:#fff;
  border-color:#9b62ff99;
}
.nav button:active{transform:scale(.985)}
@media(hover:none){.nav button:hover{transform:none}}
@media(prefers-reduced-motion:reduce){.nav button{transition:none !important;will-change:auto}}

<script>
let timer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2500)}
function choose(el,n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(innerWidth<580)document.getElementById('sidebar').classList.remove('open');toast('Раздел «'+n+'» добавим на следующем этапе')}
function openChat(n){if(innerWidth<580)document.getElementById('sidebar').classList.remove('open');toast('Чат «'+n+'» пока отображается как пример истории')}\nfunction newChat(){document.getElementById('prompt').value='';document.getElementById('prompt').focus();document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelector('.code-nav').classList.add('active');if(innerWidth<580)document.getElementById('sidebar').classList.remove('open');}
function fill(s){let p=document.getElementById('prompt');p.value=s;p.focus()}
function send(){let p=document.getElementById('prompt');toast(p.value.trim()?'Подключение ИИ сделаем следующим этапом':'Сначала напиши сообщение')}
</script></body></html>
