<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090812"><title>ASTRA — Больше, чем ИИ</title>
<style>
:root{--bg:#090812;--line:#ffffff20;--muted:#9992b5;--purple:#a98aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 65% 35%,#39216b66,transparent 42%),radial-gradient(ellipse at 95% 100%,#30205b55,transparent 35%),#090812;color:#f5f1ff;font:14px Inter,system-ui,sans-serif;overflow-x:hidden}button,textarea,input{font:inherit;color:inherit}.layout{display:flex;min-height:100vh;position:relative}.sidebar{width:240px;flex-shrink:0;padding:22px 15px 16px;background:#100e1dbb;backdrop-filter:blur(28px);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:4}.brand{display:flex;align-items:center;gap:11px;padding:3px 9px 28px}.brandicon{width:38px;height:38px;border-radius:13px;border:1px solid #c2aaff55;background:#a98aff18;display:grid;place-items:center;box-shadow:0 0 25px #9265ed30}.brandicon svg{width:26px}.brand b{letter-spacing:3px;font-size:18px}.brand small{display:block;color:#8982a5;font-size:9px;letter-spacing:1.4px;margin-top:3px}.new,.nav button,.settings{border:1px solid transparent;border-radius:11px;background:#ffffff08;padding:11px 12px;text-align:left;color:#bcb5d1;cursor:pointer}.new{border-color:#b49aff33;color:#eee8ff;background:#9c7aff16}.navlabel{font-size:9px;letter-spacing:1.6px;color:#716b89;padding:26px 10px 10px}.nav{display:grid;gap:4px}.nav button{background:transparent;font-size:12px}.nav button:hover,.nav button.active{background:#a98aff18;border-color:#b49aff25;color:#fff}.nav button.active{box-shadow:inset 2px 0 #b89aff}.ni{display:inline-block;width:24px;color:#b49aff;font-size:15px}.bottom{margin-top:auto}.settings{width:100%;background:transparent}.profile{border-top:1px solid var(--line);padding:15px 5px 0;margin-top:12px;display:flex;gap:10px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#a78aff,#55428d)}.profile small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:65px;border-bottom:1px solid #ffffff14;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#100e1d55;backdrop-filter:blur(22px)}.search{border:1px solid var(--line);background:#ffffff08;border-radius:11px;padding:9px 13px;width:min(340px,50vw);color:#aaa2c3}.search input{background:transparent;border:0;outline:0;width:90%;font-size:12px}.userbtn{border:1px solid var(--line);background:#ffffff08;border-radius:50%;width:34px;height:34px}.content{width:min(960px,100%);margin:auto;padding:35px 30px 20px;display:flex;flex:1;flex-direction:column;align-items:center}.hero{text-align:center;margin:0 auto 25px}.logoStage{width:260px;height:145px;margin:auto auto 6px}.logoStage svg{width:100%;height:100%;overflow:visible}.ribbon{fill:none;stroke:url(#rgrad);stroke-width:1.5;stroke-linecap:round;opacity:.45;stroke-dasharray:280 800;filter:url(#glow);animation:flow 13s linear infinite}.r2{animation-duration:19s;animation-direction:reverse;opacity:.32}.r3{animation-duration:24s;opacity:.22}@keyframes flow{to{stroke-dashoffset:-1080}}.liquid{fill:none;stroke:url(#liquid);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);animation:morph 4s ease-in-out infinite alternate}.shine{fill:none;stroke:#fff9;stroke-width:2;stroke-linecap:round;animation:shimmer 4s ease-in-out infinite alternate}@keyframes morph{to{stroke-width:15;filter:url(#glow) brightness(1.4)}}@keyframes shimmer{to{opacity:.25;stroke-width:3}}h1{font-size:clamp(30px,4vw,42px);font-weight:570;letter-spacing:-1.5px;margin:0 0 8px}h1 span{background:linear-gradient(100deg,#c8b6ff,#9168ef,#d5c6ff);color:transparent;background-clip:text}.hero p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.model{display:inline-flex;align-items:center;gap:8px;margin-top:17px;padding:7px 12px;border:1px solid #c2aaff25;border-radius:30px;background:#ffffff08;color:#c7bce4;font-size:10px}.dot{width:6px;height:6px;border-radius:50%;background:#b99aff;box-shadow:0 0 9px #b99aff}.cards{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}.cards button{min-height:94px;padding:14px;border:1px solid #ffffff1c;border-radius:15px;background:linear-gradient(145deg,#ffffff10,#ffffff04);backdrop-filter:blur(20px);text-align:left;cursor:pointer;transition:.2s}.cards button:hover{transform:translateY(-3px);border-color:#b89aff66;background:#a98aff14}.ci{display:block;color:#b69aff;font-size:18px;margin-bottom:11px}.cards strong{font-size:11px}.cards small{display:block;color:#928ba9;font-size:9px;margin-top:5px}.composer{width:min(790px,100%);margin:auto auto 0;padding:14px 15px 11px;border:1px solid #c3aaff38;border-radius:19px;background:linear-gradient(145deg,#34284d88,#17132699);backdrop-filter:blur(26px);box-shadow:0 16px 55px #0005,inset 0 1px #ffffff14}.composer:focus-within{border-color:#c4aaff88}.composer textarea{width:100%;height:54px;resize:none;background:transparent;border:0;outline:0;font-size:13px}.composer textarea::placeholder{color:#9189a9}.foot{display:flex;justify-content:space-between;align-items:center}.tools{display:flex;gap:7px}.tools button{border:1px solid #ffffff15;background:#ffffff08;border-radius:9px;padding:7px 9px;color:#b7aecb;font-size:10px;cursor:pointer}.send{width:33px;height:33px;border:0;border-radius:11px;background:linear-gradient(140deg,#b89aff,#7650d6);font-size:17px;cursor:pointer}.note{font-size:9px;color:#706986;margin:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#211a35ee;border:1px solid var(--line);border-radius:12px;padding:11px 15px;z-index:8;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile{display:none}
@media(max-width:760px){.sidebar{width:210px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:245px;transition:.25s}.sidebar.open{left:0}.mobile{display:inline-block;border:1px solid var(--line);background:#ffffff08;border-radius:9px;padding:7px 10px;margin-right:9px}.top{height:58px;padding:0 12px}.search{width:calc(100vw - 115px)}.content{padding:25px 14px 16px}.logoStage{width:220px;height:125px}.hero{margin-bottom:23px}.hero p{font-size:12px}.cards{gap:8px}.cards button{min-height:85px;padding:12px}.composer{border-radius:16px;padding:12px}.tools button{font-size:9px;padding:7px}.status{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="layout">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brandicon"><svg viewBox="0 0 50 50"><path d="M8 39 22 11Q25 5 28 11L42 39" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round"/><defs><linearGradient id="brandGrad"><stop stop-color="#f0e7ff"/><stop offset="1" stop-color="#9669ef"/></linearGradient></defs></svg></div><div><b>ASTRA</b><small>БОЛЬШЕ, ЧЕМ ИИ</small></div></div>
 <button class="new" onclick="toast('Новый диалог будет доступен после подключения ИИ')">＋　Новый диалог</button>
 <div class="navlabel">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav class="nav">
 <button class="active" onclick="choose(this,'Главная')"><span class="ni">⌂</span>Главная</button><button onclick="choose(this,'Code')"><span class="ni">&lt;/&gt;</span>&lt;/Code&gt;</button><button onclick="choose(this,'Проекты')"><span class="ni">▱</span>Проекты</button><button onclick="choose(this,'История')"><span class="ni">◷</span>История</button><button onclick="choose(this,'Память ASTRA')"><span class="ni">✳</span>Память ASTRA</button></nav>
 <div class="bottom"><button class="settings" onclick="toast('Настройки добавим позже')">⚙　Настройки</button><div class="profile"><div class="avatar">A</div><div><b style="font-size:11px">Мой аккаунт</b><small>Личное пространство</small></div></div></div>
</aside>
<main class="main"><header class="top"><div><button class="mobile" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><label class="search">⌕　<input placeholder="Поиск в ASTRA..."></label></div><div><span class="status" style="font-size:10px;color:#9992b5">●　Пространство готово　</span><button class="userbtn" onclick="toast('Профиль подключим позже')">A</button></div></header>
<section class="content"><div class="hero">
<div class="logoStage"><svg viewBox="0 0 300 160" aria-label="Анимированный жидкий логотип ASTRA"><defs>
<linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#cbb3ff"/><stop offset=".68" stop-color="#8052e8"/><stop offset="1" stop-color="#e2d6ff"/></linearGradient>
<linearGradient id="rgrad"><stop stop-color="#6843c4" stop-opacity="0"/><stop offset=".5" stop-color="#a783ff"/><stop offset="1" stop-color="#6843c4" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path class="ribbon" d="M-15 105 C50 15 90 155 150 75 S255 12 315 75"/><path class="ribbon r2" d="M-15 48 C55 145 95 5 155 75 S250 155 315 35"/><path class="ribbon r3" d="M-15 130 C50 65 90 160 155 100 S260 40 315 115"/>
<path class="liquid" d="M103 112 C116 88 134 46 146 27 C151 18 158 18 164 29 C177 54 194 89 207 112"/><path class="shine" d="M107 109 C122 82 139 39 149 28 C153 23 158 23 162 30 C177 57 192 91 203 109"/></svg></div>
<h1>Привет! Я <span>ASTRA</span></h1><p>Твоё пространство для идей, кода и творчества.<br>С чего начнём сегодня?</p><div class="model"><i class="dot"></i> ASTRA Auto　·　Автовыбор модели　⌄</div></div>
<div class="cards"><button onclick="fill('Помоги написать и отладить код')"><span class="ci">⌘</span><strong>Написать код</strong><small>Разработка и отладка</small></button><button onclick="fill('Помоги создать сайт')"><span class="ci">▧</span><strong>Создать сайт</strong><small>От идеи до интерфейса</small></button><button onclick="fill('Хочу создать изображение')"><span class="ci">▣</span><strong>Создать изображение</strong><small>Визуальные концепции</small></button><button onclick="fill('Помоги продумать дизайн интерфейса')"><span class="ci">◈</span><strong>Продумать дизайн</strong><small>Интерфейсы и стиль</small></button></div>
<div class="composer"><textarea id="prompt" placeholder="Напиши, что хочешь создать..."></textarea><div class="foot"><div class="tools"><button onclick="toast('Прикрепление файлов подключим позже')">＋ Файл</button><button onclick="toast('Голосовой ввод подключим позже')">♩ Голос</button><button onclick="toast('Режимы моделей подключим позже')">✧ Режим</button></div><button class="send" onclick="send()">↑</button></div></div><div class="note">ASTRA пока в разработке. Интерфейс демонстрационный.</div></section></main></div><div class="toast" id="toast"></div>
<script>
let timer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2500)}
function choose(el,n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(innerWidth<580)document.getElementById('sidebar').classList.remove('open');if(n!=='Главная')toast('Раздел «'+n+'» добавим на следующем этапе')}
function fill(s){let p=document.getElementById('prompt');p.value=s;p.focus()}
function send(){let p=document.getElementById('prompt');toast(p.value.trim()?'Подключение ИИ сделаем следующим этапом':'Сначала напиши сообщение')}
</script></body></html>
